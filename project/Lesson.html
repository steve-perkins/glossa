<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Glossa — Lesson</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&family=Noto+Sans:wght@400;500;600&display=swap" rel="stylesheet" />

<style>
:root {
  --cream: #f6f1e6;
  --cream-2: #efe7d6;
  --cream-3: #e6dcc6;
  --paper: #fbf7ee;
  --ink: #221c14;
  --ink-2: #3a3127;
  --ink-3: #5d5446;
  --ink-4: #8a8170;
  --ink-5: #b6ad9a;
  --rule: rgba(34,28,20,0.10);
  --rule-2: rgba(34,28,20,0.06);
  --accent: #c5613a;
  --accent-2: #a64f2c;
  --accent-soft: #f1d6c5;
  --accent-ghost: rgba(197,97,58,0.10);
  --done: #5d6f30;
  --done-soft: #dde2c4;
  --wrong: #b14a3a;
  --wrong-soft: #f3d6cf;
  --radius: 14px;
  --radius-lg: 22px;
  --shadow-1: 0 1px 0 rgba(255,255,255,0.6) inset, 0 1px 2px rgba(34,28,20,0.06);
  --shadow-2: 0 1px 0 rgba(255,255,255,0.7) inset, 0 8px 24px rgba(34,28,20,0.08);
  --pad: clamp(16px, 3vw, 32px);
  --font-target: 'Noto Sans', 'Manrope', ui-sans-serif, system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: 'Manrope', ui-sans-serif, system-ui, -apple-system, sans-serif;
  background: var(--cream);
  color: var(--ink);
  font-size: 15.5px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(900px 600px at 110% -10%, var(--accent-ghost), transparent 60%),
    radial-gradient(700px 500px at -10% 110%, rgba(34,28,20,0.04), transparent 60%);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
input { font: inherit; color: inherit; }

.ls-app {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
}

/* ─── Header ─── */
.ls-head {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 18px;
  padding: 16px var(--pad);
  border-bottom: 1px solid var(--rule);
  background: color-mix(in oklab, var(--cream) 80%, transparent);
  backdrop-filter: blur(16px) saturate(160%);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  position: sticky; top: 0; z-index: 10;
}
.ls-exit {
  width: 36px; height: 36px; border-radius: 10px;
  border: 1px solid var(--rule); background: var(--paper);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-3);
  transition: color .15s, background .15s;
}
.ls-exit:hover { color: var(--ink); background: var(--cream-2); }

.ls-progress {
  display: flex; gap: 4px; align-items: center;
  width: 100%;
  max-width: 560px;
  margin: 0 auto;
}
.ls-pip {
  flex: 1; height: 5px; border-radius: 3px;
  background: var(--rule);
  transition: background .25s, height .15s;
}
.ls-pip.is-current { background: var(--accent); }
.ls-pip.is-past { background: var(--ink-3); }
.ls-pip.is-correct { background: var(--done); }
.ls-pip.is-wrong { background: var(--wrong); }

.ls-meta { text-align: right; line-height: 1.1; }
.ls-meta-lang { font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase; color: var(--ink-4); font-weight: 600; display: block; }
.ls-meta-title { font-family: 'Instrument Serif', serif; font-style: italic; font-size: 18px; }

/* ─── Stage ─── */
.ls-stage {
  padding: clamp(28px, 5vw, 64px) var(--pad);
  display: flex; align-items: flex-start; justify-content: center;
  animation: ls-fade .25s ease-out;
}
@keyframes ls-fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.ls-stage-inner { width: 100%; max-width: 760px; }

.ls-slide { display: flex; flex-direction: column; gap: 16px; }
.ls-eyebrow {
  font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--accent); font-weight: 700;
}
.ls-h {
  font-family: 'Instrument Serif', serif;
  font-style: italic; font-weight: 400;
  font-size: clamp(28px, 4vw, 40px);
  line-height: 1.15;
  letter-spacing: -0.01em;
  margin: 0;
  text-wrap: pretty;
}

/* Grammar */
.ls-grammar { gap: 18px; }
.ls-prose p { margin: 0 0 12px; color: var(--ink-2); font-size: 16px; line-height: 1.65; max-width: 60ch; }
.ls-callout {
  display: flex; gap: 12px; align-items: flex-start;
  padding: 14px 16px;
  background: var(--accent-ghost);
  border-left: 3px solid var(--accent);
  border-radius: 0 12px 12px 0;
  color: var(--accent-2);
  font-weight: 500;
}
.ls-callout-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent); color: var(--cream);
  font-family: 'Instrument Serif', serif; font-style: italic; font-size: 16px;
  flex-shrink: 0;
}
.ls-tablewrap { overflow-x: auto; }
.ls-table {
  width: 100%; border-collapse: collapse;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 12px;
  overflow: hidden;
  font-size: 14px;
}
.ls-table th, .ls-table td {
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid var(--rule);
}
.ls-table th { background: var(--cream-2); font-weight: 600; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); }
.ls-table tr:last-child td { border-bottom: 0; }
.ls-table td:last-child { font-family: var(--font-target); font-weight: 500; font-size: 17px; color: var(--accent-2); }

/* Vocab */
.ls-vocab { gap: 20px; }
.ls-vocab-main {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 28px;
  align-items: center;
}
.ls-vocab-text { display: flex; flex-direction: column; gap: 6px; }
.ls-word {
  font-family: var(--font-target);
  font-weight: 500;
  font-size: clamp(48px, 8vw, 80px);
  line-height: 1.05; letter-spacing: -0.01em;
  margin: 0;
  color: var(--ink);
}
.ls-romanization {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px; color: var(--ink-4);
}
.ls-translation { font-size: 18px; color: var(--ink-2); margin-bottom: 8px; }
.ls-audio {
  display: inline-flex; align-items: center; gap: 8px;
  align-self: flex-start;
  padding: 10px 14px;
  border-radius: 99px;
  background: var(--paper);
  border: 1px solid var(--rule);
  color: var(--ink-2);
  font-weight: 600; font-size: 13px;
  transition: background .15s, color .15s;
}
.ls-audio:hover { background: var(--accent-ghost); color: var(--accent-2); border-color: var(--accent); }
.ls-audio.is-playing { background: var(--accent); color: var(--cream); border-color: var(--accent); }
.ls-audio.is-playing svg { animation: pulse-icon 1s ease-in-out infinite; }
@keyframes pulse-icon { 0%,100% { transform: scale(1); } 50% { transform: scale(1.1); } }

.ls-vocab-photo { width: 200px; }
.ls-photo {
  position: relative;
  aspect-ratio: 4/5;
  border-radius: 16px;
  overflow: hidden;
  background: var(--cream-2);
  color: var(--ink-5);
  border: 1px solid var(--rule);
}
.ls-photo-stripe { position: absolute; inset: 0; width: 100%; height: 100%; }
.ls-photo-caption {
  position: absolute; left: 8px; bottom: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  background: var(--paper);
  color: var(--ink-3);
  padding: 4px 6px; border-radius: 4px;
  border: 1px solid var(--rule);
}

.ls-example {
  display: flex; flex-direction: column; gap: 6px;
  padding: 16px 18px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 14px;
}
.ls-example-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.ls-audio.is-small {
  padding: 6px 10px; font-size: 12px; gap: 6px;
}
.ls-example-label { font-size: 11px; letter-spacing: 0.10em; text-transform: uppercase; color: var(--ink-4); font-weight: 600; }
.ls-example-target { font-family: var(--font-target); font-weight: 500; font-size: 22px; line-height: 1.3; color: var(--ink); }
.ls-example-en { color: var(--ink-3); font-size: 14px; }

/* MC + Fill — shared sentence styling */
.ls-mc-prompt { font-size: clamp(22px, 3vw, 30px); }
.ls-en-target {
  margin: 0;
  font-style: italic;
  color: var(--ink-3);
  font-family: 'Instrument Serif', serif;
  font-size: 18px;
}
.ls-sentence {
  display: flex; flex-wrap: wrap; align-items: baseline;
  gap: 6px 6px;
  padding: 24px 20px;
  background: var(--paper);
  border: 1px solid var(--rule);
  border-radius: 16px;
  font-family: var(--font-target);
  font-weight: 500;
  font-size: clamp(20px, 3vw, 26px);
  line-height: 1.6;
  margin: 4px 0;
}
.ls-sent-word { color: var(--ink); }

.ls-blank {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 4ch;
  padding: 4px 14px;
  font: inherit;
  border: 0;
  border-radius: 8px;
  background: var(--accent-ghost);
  color: var(--accent-2);
  border-bottom: 2px dashed var(--accent);
  transition: all .15s;
}
.ls-blank.is-empty { color: var(--ink-5); background: var(--rule-2); border-bottom-color: var(--ink-5); }
.ls-blank.is-filled { background: var(--accent); color: var(--cream); border-bottom-color: var(--accent-2); }
.ls-blank.is-correct { background: var(--done); border-bottom-color: var(--done); color: #fff; }
.ls-blank.is-wrong { background: var(--wrong); border-bottom-color: var(--wrong); color: #fff; }

.ls-bank {
  display: flex; flex-wrap: wrap; gap: 8px;
  padding: 4px 0;
}
.ls-chip {
  padding: 12px 18px;
  font-family: var(--font-target);
  font-weight: 500;
  font-size: 18px;
  border: 1px solid var(--rule);
  border-bottom-width: 3px;
  border-radius: 12px;
  background: var(--paper);
  color: var(--ink);
  box-shadow: var(--shadow-1);
  transition: transform .1s, background .15s, color .15s;
}
.ls-chip:hover:not(:disabled) { background: var(--accent-ghost); color: var(--accent-2); border-color: var(--accent); }
.ls-chip:active { transform: translateY(1px); border-bottom-width: 1px; }
.ls-chip.is-used {
  opacity: 0.35;
  pointer-events: none;
}
.ls-chip:disabled { cursor: not-allowed; }

.ls-input {
  font-family: var(--font-target);
  font-weight: 500;
  font-size: inherit;
  color: var(--accent-2);
  background: var(--accent-ghost);
  border: 0;
  border-bottom: 2px solid var(--accent);
  border-radius: 8px;
  padding: 4px 8px;
  outline: none;
  text-align: center;
  transition: background .15s, color .15s;
}
.ls-input:focus { background: color-mix(in oklab, var(--accent-ghost) 100%, var(--accent) 8%); box-shadow: 0 0 0 4px var(--accent-ghost); }
.ls-input.is-correct { background: var(--done-soft); color: var(--done); border-bottom-color: var(--done); }
.ls-input.is-wrong { background: var(--wrong-soft); color: var(--wrong); border-bottom-color: var(--wrong); }

.ls-hint {
  display: inline-flex; align-items: center; gap: 8px;
  margin: 0;
  font-size: 13px; color: var(--ink-3);
  font-style: italic;
}
.ls-hint-mark {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--ink-5); color: var(--cream);
  font-style: normal; font-weight: 700; font-size: 11px;
}

/* Feedback */
.ls-feedback {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
  border-radius: 12px;
  font-weight: 500;
  animation: ls-pop .25s ease-out;
}
@keyframes ls-pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.ls-feedback.is-correct { background: var(--done-soft); color: var(--done); }
.ls-feedback.is-wrong { background: var(--wrong-soft); color: var(--wrong); }
.ls-feedback-icon {
  width: 28px; height: 28px; border-radius: 50%;
  background: currentColor;
  color: var(--paper);
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.ls-feedback.is-correct .ls-feedback-icon { color: var(--done-soft); }
.ls-feedback.is-correct .ls-feedback-icon svg { color: var(--done); }
.ls-feedback.is-wrong .ls-feedback-icon { color: var(--wrong-soft); }
.ls-feedback.is-wrong .ls-feedback-icon svg { color: var(--wrong); }
.ls-feedback-expected b { font-family: var(--font-target); font-weight: 600; font-size: 16px; }

/* Done */
.ls-done {
  text-align: center; align-items: center;
  padding: 40px 20px;
  gap: 24px;
}
.ls-done-medal { animation: ls-pop .4s ease-out; }
.ls-done-title {
  font-family: 'Instrument Serif', serif;
  font-style: italic; font-weight: 400;
  font-size: clamp(36px, 6vw, 56px);
  margin: 0;
}
.ls-done-stats {
  display: flex; gap: 24px;
  flex-wrap: wrap; justify-content: center;
}
.ls-done-stat {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 18px 28px;
  border: 1px solid var(--rule);
  border-radius: 16px;
  background: var(--paper);
  min-width: 140px;
}
.ls-done-num {
  font-family: 'Instrument Serif', serif;
  font-style: italic;
  font-size: 44px; line-height: 1;
  color: var(--accent);
}
.ls-done-lbl { font-size: 12px; color: var(--ink-3); letter-spacing: 0.04em; }

/* ─── Footer / CTA ─── */
.ls-foot {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 16px;
  padding: 16px var(--pad);
  border-top: 1px solid var(--rule);
  background: color-mix(in oklab, var(--cream) 90%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  position: sticky; bottom: 0;
}
.ls-prev {
  justify-self: start;
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 14px;
  border-radius: 10px;
  border: 0; background: transparent;
  color: var(--ink-3);
  font-weight: 600;
}
.ls-prev:hover:not(:disabled) { background: var(--rule-2); color: var(--ink); }
.ls-prev:disabled { opacity: 0.3; }
.ls-foot-count {
  justify-self: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--ink-4);
  font-variant-numeric: tabular-nums;
}
.ls-foot-count span { opacity: 0.5; }
.ls-cta {
  justify-self: end;
  display: inline-flex; align-items: center; gap: 8px;
  padding: 14px 24px;
  border-radius: 12px;
  border: 0;
  background: var(--ink);
  color: var(--cream);
  font-weight: 700; font-size: 14px;
  border-bottom: 3px solid color-mix(in oklab, var(--ink) 60%, #000);
  transition: transform .1s, opacity .15s;
  min-width: 140px;
  justify-content: center;
}
.ls-cta:hover:not(:disabled) { transform: translateY(-1px); }
.ls-cta:active:not(:disabled) { transform: translateY(1px); border-bottom-width: 1px; }
.ls-cta:disabled { opacity: 0.4; }
.ls-cta.is-ok { background: var(--done); border-bottom-color: color-mix(in oklab, var(--done) 60%, #000); }
.ls-cta.is-wrong { background: var(--wrong); border-bottom-color: color-mix(in oklab, var(--wrong) 60%, #000); }

/* Responsive */
@media (max-width: 720px) {
  .ls-meta { display: none; }
  .ls-vocab-main { grid-template-columns: 1fr; }
  .ls-vocab-photo { width: 160px; }
  .ls-word { font-size: 56px; }
  .ls-cta { padding: 12px 18px; min-width: 0; }
  .ls-prev span { display: none; }
  .ls-prev { padding: 8px; }
  .ls-foot { grid-template-columns: auto 1fr auto; }
  .ls-sentence { font-size: 22px; padding: 18px 14px; }
  .ls-chip { font-size: 18px; padding: 10px 14px; }
}
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="lesson-data.jsx"></script>
  <script type="text/babel" src="lesson-slides.jsx"></script>
  <script type="text/babel" src="lesson-app.jsx"></script>
</body>
</html>
